    <style>
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'DM Sans',sans-serif;background:#0a0f1e;color:#e2e8f0;line-height:1.6;}
        .topbar{background:#111827;border-bottom:1px solid #1e2d45;padding:14px 24px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;}

        h1{font-family:'Syne',sans-serif;font-size:32px;margin-bottom:20px;background:linear-gradient(135deg,#00d4ff,#7c3aed);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

        label{display:block;margin-bottom:5px;color:#94a3b8;}

        .footer{background:#111827;border-top:1px solid #1e2d45;text-align:center;padding:20px;font-size:13px;color:#64748b;}

<body>
<div class="topbar">
    <a class="logo" href="index.html">⚡ QuickToolKit</a>
    <div class="nav-links"><a href="index.html">Home</a><a href="about.html">About</a><a href="privacy-policy.html">Privacy</a><a href="percentage-calculator.html">Percentage</a></div>
</div>
<div class="container">
    <h1>📊 Percentage Calculator</h1>
    <div class="ad-slot"><script>atOptions={'key':'daee511c7e108b897596bf858c83ff8a','format':'iframe','height':250,'width':300};</script><script src="https://www.highperformanceformat.com/daee511c7e108b897596bf858c83ff8a/invoke.js"></script></div>
    <div class="tool-box">
        <div class="mode-buttons">
            <button class="mode-btn active" data-mode="1" onclick="setMode(1)">% of a number</button>
            <button class="mode-btn" data-mode="2" onclick="setMode(2)">What percent?</button>
            <button class="mode-btn" data-mode="3" onclick="setMode(3)">Increase/Decrease</button>
            <button class="mode-btn" data-mode="4" onclick="setMode(4)">% of what?</button>
        </div>
        <div id="mode1" class="mode-panel">
            <div class="input-group"><label>X% of Y</label><input type="number" id="p1_perc" placeholder="Percentage (X)"><input type="number" id="p1_num" placeholder="Number (Y)"></div>
            <button onclick="calc1()">Calculate</button>
            <div class="result" id="res1">-</div>
        </div>
        <div id="mode2" class="mode-panel" style="display:none;">
            <div class="input-group"><label>X is what % of Y?</label><input type="number" id="p2_x" placeholder="X"><input type="number" id="p2_y" placeholder="Y"></div>
            <button onclick="calc2()">Calculate</button>
            <div class="result" id="res2">-</div>
        </div>
        <div id="mode3" class="mode-panel" style="display:none;">
            <div class="input-group"><label>From X to Y</label><input type="number" id="p3_from" placeholder="From"><input type="number" id="p3_to" placeholder="To"></div>
            <button onclick="calc3()">Calculate</button>
            <div class="result" id="res3">-</div>
        </div>
        <div id="mode4" class="mode-panel" style="display:none;">
            <div class="input-group"><label>X% of what is Y?</label><input type="number" id="p4_perc" placeholder="Percentage (X)"><input type="number" id="p4_num" placeholder="Result (Y)"></div>
            <button onclick="calc4()">Calculate</button>
            <div class="result" id="res4">-</div>
        </div>
    </div>
    <div class="ad-slot"><script>atOptions={'key':'4666458c30cee453a15f5ca1e9b5aba4','format':'iframe','height':90,'width':728};</script><script src="https://www.highperformanceformat.com/4666458c30cee453a15f5ca1e9b5aba4/invoke.js"></script></div>
</div>
<div class="footer"><p>© 2026 QuickToolKit – Free Online Tools | <a href="privacy-policy.html">Privacy Policy</a> | <a href="about.html">About Us</a></p></div>
<script>
    function setMode(mode) {
        document.querySelectorAll('.mode-panel').forEach(panel => panel.style.display = 'none');
        document.getElementById(`mode${mode}`).style.display = 'block';
        document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
        document.querySelector(`[data-mode="${mode}"]`).classList.add('active');
    }
    function calc1() {
        let perc = parseFloat(document.getElementById('p1_perc').value);
        let num = parseFloat(document.getElementById('p1_num').value);
        if(isNaN(perc) || isNaN(num)) { document.getElementById('res1').innerText = 'Enter valid numbers'; return; }
        let result = (perc/100) * num;
        document.getElementById('res1').innerHTML = `${perc}% of ${num} = ${result.toFixed(2)}`;
    }
    function calc2() {
        let x = parseFloat(document.getElementById('p2_x').value);
        let y = parseFloat(document.getElementById('p2_y').value);
        if(isNaN(x) || isNaN(y) || y===0) { document.getElementById('res2').innerText = 'Invalid input'; return; }
        let result = (x/y)*100;
        document.getElementById('res2').innerHTML = `${x} is ${result.toFixed(2)}% of ${y}`;
    }
    function calc3() {
        let from = parseFloat(document.getElementById('p3_from').value);
        let to = parseFloat(document.getElementById('p3_to').value);
        if(isNaN(from) || isNaN(to)) { document.getElementById('res3').innerText = 'Invalid numbers'; return; }
        let change = ((to - from)/Math.abs(from))*100;
        document.getElementById('res3').innerHTML = `Change: ${change.toFixed(2)}% ${change>=0 ? 'increase' : 'decrease'}`;
    }
    function calc4() {
        let perc = parseFloat(document.getElementById('p4_perc').value);
        let y = parseFloat(document.getElementById('p4_num').value);
        if(isNaN(perc) || isNaN(y) || perc===0) { document.getElementById('res4').innerText = 'Invalid input'; return; }
        let result = (y/(perc/100));
        document.getElementById('res4').innerHTML = `${perc}% of ${result.toFixed(2)} = ${y}`;
    }
</script>
</body>
