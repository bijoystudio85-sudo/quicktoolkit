        <input type="number" id="count" value="3" min="1" max="50">

<script>
    const loremIpsum = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum.";
    const words = loremIpsum.split(' ');
    const sentences = loremIpsum.split('. ');

    function generateLorem() {
        let type = document.getElementById('type').value;
        let count = parseInt(document.getElementById('count').value);
        let output = '';
        if(type === 'paragraphs') {
            for(let i=0; i<count; i++) output += loremIpsum + '\n\n';
        } else if(type === 'words') {
            let wordArr = [];
            for(let i=0; i<count; i++) wordArr.push(words[i % words.length]);
            output = wordArr.join(' ') + '.';
        } else if(type === 'sentences') {
            let sentArr = [];
            for(let i=0; i<count; i++) sentArr.push(sentences[i % sentences.length]);
            output = sentArr.join('. ') + '.';
        }
        document.getElementById('output').value = output.trim();
    }
    function copyText() { navigator.clipboard.writeText(document.getElementById('output').value); alert('Copied!'); }
    window.onload = generateLorem;
</script>
