<script>
    const input = document.getElementById('inputText');
    const output = document.getElementById('outputText');
    function encodeBase64() {
        try { output.value = btoa(input.value); } 
        catch(e) { alert('Invalid text for encoding. Use only Latin1 characters.'); }
    }
    function decodeBase64() {
        try { output.value = atob(input.value); } 
        catch(e) { alert('Invalid Base64 string.'); }
    }
    function clearFields() { input.value = ''; output.value = ''; }
    function copyResult() { navigator.clipboard.writeText(output.value); alert('Copied!'); }
</script>
