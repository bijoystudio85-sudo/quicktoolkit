    <div class="tool-box">
        <textarea id="inputText" placeholder="Type or paste your text here..."></textarea>
        <div class="btn-group">
            <button onclick="toUpperCase()">UPPER CASE</button>
            <button onclick="toLowerCase()">lower case</button>
            <button onclick="toTitleCase()">Title Case</button>
            <button onclick="toSentenceCase()">Sentence case</button>
            <button onclick="toToggleCase()">tOGGLE cASE</button>
            <button class="primary" onclick="copyResult()">📋 Copy Result</button>

        </div>

<script>
    const input = document.getElementById('inputText');
    const output = document.getElementById('outputText');
    function toUpperCase() { output.value = input.value.toUpperCase(); }
    function toLowerCase() { output.value = input.value.toLowerCase(); }
    function toTitleCase() {
        let str = input.value.toLowerCase();
        output.value = str.replace(/\b\w/g, c => c.toUpperCase());
    }
    function toSentenceCase() {
        let str = input.value.toLowerCase();
        output.value = str.replace(/(^\s*\w|[.!?]\s*\w)/g, c => c.toUpperCase());
    }
    function toToggleCase() {
        let result = '';
        for(let i=0; i<input.value.length; i++) {
            let ch = input.value[i];
            if(ch === ch.toUpperCase()) result += ch.toLowerCase();
            else result += ch.toUpperCase();
        }
        output.value = result;
    }
    function copyResult() { navigator.clipboard.writeText(output.value); alert('Copied!'); }
    function clearText() { input.value = ''; output.value = ''; }
</script>
